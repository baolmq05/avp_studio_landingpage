<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <rect width="240" height="240" fill="#FFFFFF" rx="4"/>
  <rect x="8" y="8" width="224" height="224" fill="none" stroke="#EBE5DD" stroke-width="1.5"/>

  <!-- Corner Finder Pattern: Top-Left -->
  <rect x="24" y="24" width="48" height="48" fill="none" stroke="#171717" stroke-width="6"/>
  <rect x="36" y="36" width="24" height="24" fill="#171717"/>

  <!-- Corner Finder Pattern: Top-Right -->
  <rect x="168" y="24" width="48" height="48" fill="none" stroke="#171717" stroke-width="6"/>
  <rect x="180" y="36" width="24" height="24" fill="#C93E27"/>

  <!-- Corner Finder Pattern: Bottom-Left -->
  <rect x="24" y="168" width="48" height="48" fill="none" stroke="#171717" stroke-width="6"/>
  <rect x="36" y="180" width="24" height="24" fill="#C93E27"/>

  <!-- Alignment Pattern: Bottom-Right -->
  <rect x="176" y="176" width="32" height="32" fill="none" stroke="#171717" stroke-width="4"/>
  <rect x="186" y="186" width="12" height="12" fill="#171717"/>

  <!-- Timing Patterns -->
  <g fill="#171717">
    <rect x="80" y="44" width="8" height="8"/>
    <rect x="96" y="44" width="8" height="8"/>
    <rect x="112" y="44" width="8" height="8"/>
    <rect x="128" y="44" width="8" height="8"/>
    <rect x="144" y="44" width="8" height="8"/>

    <rect x="44" y="80" width="8" height="8"/>
    <rect x="44" y="96" width="8" height="8"/>
    <rect x="44" y="112" width="8" height="8"/>
    <rect x="44" y="128" width="8" height="8"/>
    <rect x="44" y="144" width="8" height="8"/>

    <!-- Abstract Data Cells -->
    <rect x="84" y="76" width="10" height="10"/>
    <rect x="116" y="76" width="10" height="10"/>
    <rect x="148" y="76" width="10" height="10"/>
    <rect x="96" y="96" width="10" height="10"/>
    <rect x="132" y="96" width="10" height="10"/>
    <rect x="84" y="148" width="10" height="10"/>
    <rect x="116" y="148" width="10" height="10"/>
    <rect x="148" y="148" width="10" height="10"/>
    <rect x="84" y="176" width="10" height="10"/>
    <rect x="112" y="176" width="10" height="10"/>
    <rect x="140" y="176" width="10" height="10"/>
  </g>

  <!-- Red Accent Data Dots -->
  <g fill="#C93E27">
    <rect x="100" y="76" width="10" height="10"/>
    <rect x="136" y="148" width="10" height="10"/>
    <rect x="126" y="176" width="10" height="10"/>
  </g>

  <!-- Clear Placeholder Notice Badge in Center -->
  <rect x="52" y="104" width="136" height="32" rx="4" fill="#171717" stroke="#C93E27" stroke-width="1.5"/>
  <text x="120" y="118" fill="#FFFFFF" font-family="'Barlow Condensed', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">QR PLACEHOLDER 02</text>
  <text x="120" y="129" fill="#F4F0EA" opacity="0.75" font-family="'Barlow', sans-serif" font-size="7.5" font-weight="500" letter-spacing="0.5" text-anchor="middle">SCAN ON RELEASE</text>
</svg>
